<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: Unbounded; font-weight: 200 900; src: url('../../landing/fonts/unbounded-latin-wght-normal.woff2') format('woff2'); }
      @font-face { font-family: Inter; font-weight: 100 900; src: url('../../landing/fonts/inter-latin-wght-normal.woff2') format('woff2'); }
      @font-face { font-family: Unbounded; font-weight: 200 900; src: url('../../landing/fonts/unbounded-cyrillic-wght-normal.woff2') format('woff2'); unicode-range: U+0400-04FF; }
      @font-face { font-family: Inter; font-weight: 100 900; src: url('../../landing/fonts/inter-cyrillic-wght-normal.woff2') format('woff2'); unicode-range: U+0400-04FF; }
      html, body { margin: 0; }
      .card { position: relative; overflow: hidden; background: #155eef; color: #fff; font-family: Inter, sans-serif; }
      .route { position: absolute; inset: 0; width: 100%; height: 100%; }
      .copy h1 { margin: 0; font-weight: 750; font-family: Unbounded, Inter, sans-serif; line-height: 1.08; letter-spacing: -0.02em; text-wrap: balance; }
      .copy p { margin: 0.75em 0 0; line-height: 1.3; font-weight: 500; color: rgb(255 255 255 / 0.86); text-wrap: balance; }
      .device { position: absolute; box-sizing: border-box; background: #0e1526; box-shadow: 0 60px 120px -30px rgb(8 20 60 / 0.6), inset 0 0 0 3px #2a3550; }
      .screen { position: relative; overflow: hidden; background: #fff; }
      .screen img { display: block; width: 100%; height: 100%; }
      .bar { position: absolute; inset: 0 0 auto; background: inherit; }
      .camera { position: absolute; left: 50%; border-radius: 50%; background: #0e1526; }
      .shot { position: absolute; left: 0; right: 0; bottom: 0; }
      .moose { position: absolute; filter: drop-shadow(0 30px 40px rgb(14 21 38 / 0.4)); }

      .phone { width: 1080px; height: 1920px; }
      .phone .copy { position: absolute; left: 70px; right: 70px; top: 130px; text-align: center; }
      .phone h1 { font-size: 78px; }
      .phone p { font-size: 40px; }
      .phone .device { left: 168px; top: 540px; width: 744px; height: 1350px; padding: 22px; border-radius: 96px; }
      .phone .screen { width: 700px; height: 1306px; border-radius: 76px; }
      .phone .bar { height: 62px; }
      .phone .camera { top: 22px; width: 26px; height: 26px; margin-left: -13px; }
      .phone .shot { top: 62px; }
      .phone .moose { right: -70px; bottom: -10px; width: 330px; }

      .tablet { width: 1440px; height: 2560px; }
      .tablet .copy { position: absolute; left: 110px; right: 110px; top: 180px; text-align: center; }
      .tablet h1 { font-size: 104px; }
      .tablet p { font-size: 52px; }
      .tablet .device { left: 124px; top: 700px; width: 1192px; height: 1920px; padding: 36px; border-radius: 80px; }
      .tablet .screen { width: 1120px; height: 1848px; border-radius: 48px; }
      .tablet .bar { height: 56px; }
      .tablet .camera { top: 18px; width: 20px; height: 20px; margin-left: -10px; }
      .tablet .shot { top: 56px; }
      .tablet .moose { right: -90px; bottom: -10px; width: 420px; }

      .desktop { width: 1920px; height: 1080px; }
      .desktop .copy { position: absolute; left: 100px; width: 560px; top: 50%; transform: translateY(-50%); }
      .desktop h1 { font-size: 64px; }
      .desktop p { font-size: 32px; }
      .desktop .device { left: 720px; top: 150px; width: 1140px; height: 741px; padding: 22px 22px 34px; border-radius: 30px 30px 10px 10px; }
      .desktop .device::after { content: ''; position: absolute; left: -70px; right: -70px; bottom: -34px; height: 34px; border-radius: 0 0 26px 26px; background: #2a3550; }
      .desktop .screen { width: 1096px; height: 685px; border-radius: 10px; }
      .desktop .bar { height: 0; }
      .desktop .camera { display: none; }
      .desktop .shot { top: 0; }
      .desktop .moose { left: 70px; bottom: -40px; width: 240px; }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <svg class="route" id="route" fill="none" stroke-linecap="round"></svg>
      <div class="copy">
        <h1 id="title"></h1>
        <p id="text"></p>
      </div>
      <div class="device">
        <div class="screen">
          <div class="bar"><span class="camera"></span></div>
          <div class="shot"><img id="shot" alt="" /></div>
        </div>
      </div>
      <img class="moose" id="moose" src="../../landing/mascot/moose-900.webp" alt="" hidden />
    </div>
    <script>
      const ROUTES = {
        phone: ['0 0 1080 1920', 'M-60 760C160 700 220 980 420 940S880 640 1140 700', 'M-80 1500C160 1380 260 1560 520 1480S900 1260 1160 1300'],
        tablet: ['0 0 1440 2560', 'M-80 1010C210 930 290 1300 560 1250S1170 850 1520 930', 'M-100 2000C210 1840 350 2080 690 1970S1200 1680 1540 1730'],
        desktop: ['0 0 1920 1080', 'M640 -40C760 200 700 420 980 470S1500 260 1980 330', 'M600 1120C820 880 1100 1000 1380 900S1760 700 1980 760'],
      };

      window.fill = ({ layout, title, text, shot, moose }) => {
        const card = document.getElementById('card');
        card.className = `card ${layout}`;
        const [box, first, second] = ROUTES[layout];
        const route = document.getElementById('route');
        route.setAttribute('viewBox', box);
        route.innerHTML = `<path d="${first}" stroke="#3d80ff" stroke-width="30" /><path d="${second}" stroke="#0f4fd1" stroke-width="30" />`;
        document.getElementById('title').textContent = title;
        document.getElementById('text').textContent = text;
        document.getElementById('shot').src = shot;
        document.getElementById('moose').hidden = !moose;

        const heading = document.getElementById('title');
        heading.style.fontSize = '';
        const copy = document.querySelector('.copy');
        const limit = { phone: 500, tablet: 650, desktop: 1000 }[layout];
        const start = parseFloat(getComputedStyle(heading).fontSize);
        for (let size = start; size >= start * 0.66; size -= 2) {
          heading.style.fontSize = `${size}px`;
          const bounds = copy.getBoundingClientRect();
          if (bounds.bottom <= limit && bounds.top >= (layout === 'desktop' ? 80 : 0)) break;
        }
        return Promise.all([...document.images].filter((image) => !image.hidden).map((image) => image.decode()));
      };
    </script>
  </body>
</html>
