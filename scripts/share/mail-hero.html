<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: Unbounded; font-weight: 200 900; src: url('../../landing/fonts/unbounded-latin-wght-normal.woff2') format('woff2'); }
      @font-face { font-family: Unbounded; font-weight: 200 900; src: url('../../landing/fonts/unbounded-cyrillic-wght-normal.woff2') format('woff2'); unicode-range: U+0400-04FF; }
      @font-face { font-family: Inter; font-weight: 100 900; src: url('../../landing/fonts/inter-latin-wght-normal.woff2') format('woff2'); }
      @font-face { font-family: Inter; font-weight: 100 900; src: url('../../landing/fonts/inter-cyrillic-wght-normal.woff2') format('woff2'); unicode-range: U+0400-04FF; }
      html, body { margin: 0; }

      .hero { position: relative; width: 1200px; height: 520px; overflow: hidden; background: #155eef; color: #fff; font-family: Inter, sans-serif; }
      .route { position: absolute; inset: 0; }
      .brand { position: absolute; left: 72px; top: 62px; display: flex; align-items: center; gap: 16px; }
      .brand svg { width: 60px; height: 60px; }
      .brand b { font: 800 50px/1 Unbounded, sans-serif; letter-spacing: 0.02em; }
      .title { position: absolute; left: 72px; top: 190px; width: 680px; margin: 0; font: 800 76px/1.04 Unbounded, sans-serif; letter-spacing: -0.02em; }
      .tag { position: absolute; left: 72px; bottom: 64px; padding: 12px 24px; border-radius: 999px; background: #ffc83d; color: #0e1526; font-size: 28px; font-weight: 800; }
      .moose { position: absolute; right: 20px; bottom: -60px; width: 400px; filter: drop-shadow(0 26px 34px rgb(14 21 38 / 0.38)); }
    </style>
  </head>
  <body>
    <div class="hero">
      <svg class="route" viewBox="0 0 1200 520" fill="none" stroke-linecap="round">
        <path d="M-40 470C200 470 260 330 500 340S800 170 1240 120" stroke="#3d80ff" stroke-width="26" />
        <path d="M300 600C420 470 640 520 820 470S1080 360 1240 380" stroke="#0f4fd1" stroke-width="26" />
      </svg>
      <div class="brand">
        <svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 50V14h17.5a12.5 12.5 0 0 1 0 25H21" /><path d="M38 39l11 11" /><circle cx="37.5" cy="26.5" r="3.6" fill="#fff" stroke="none" /></svg>
        <b>RAITTA</b>
      </div>
      <h1 class="title" id="title"></h1>
      <span class="tag" id="tag"></span>
      <img class="moose" src="../../landing/mascot/moose-900.webp" alt="" />
    </div>
    <script>
      window.fill = ({ title, tag }) => {
        document.getElementById('title').textContent = title;
        document.getElementById('tag').textContent = tag;
        const heading = document.getElementById('title');

        for (let size = 76; size >= 52; size -= 2) {
          heading.style.fontSize = `${size}px`;
          if (heading.getBoundingClientRect().bottom <= 400) break;
        }
        return document.fonts.ready;
      };
    </script>
  </body>
</html>
