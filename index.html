<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>RAITTA</title>
    <meta name="description" content="Real-time public transport across Finland. Move with the city." />
    <meta name="theme-color" content="#155EEF" />

    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="preconnect" href="https://photon.komoot.io" crossorigin />
    <link rel="dns-prefetch" href="https://route.raitta.fi" />
    <link rel="dns-prefetch" href="https://upload.wikimedia.org" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RAITTA" />
    <meta property="og:title" content="RAITTA · Live map" />
    <meta property="og:description" content="Buses, trams, metro and trains moving on the map in real time, across Finland." />
    <meta property="og:url" content="https://maps.raitta.fi/" />
    <link rel="canonical" href="https://maps.raitta.fi/" />
    <meta property="og:image" content="https://raitta.fi/screens/share-2026-11.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RAITTA, the moose and a phone with a route" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://raitta.fi/screens/share-2026-11.jpg" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preload" as="image" href="/src/assets/moose.webp" type="image/webp" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RAITTA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #155eef;
        z-index: 100;
        transition: opacity 0.25s ease;
      }
      #boot svg {
        width: 88px;
        height: 88px;
      }

      .r-draw path {
        stroke-dasharray: 130;
        animation: r-draw 0.75s cubic-bezier(0.6, 0, 0.3, 1) 0.1s both;
      }
      .r-draw path + path {
        stroke-dasharray: 20;
        animation: r-leg 0.3s ease-out 0.7s both;
      }
      .r-draw circle {
        transform-origin: 37.5px 26.5px;
        animation: r-dot 0.45s cubic-bezier(0.3, 1.8, 0.5, 1) 0.9s both;
      }
      .r-draw {
        animation: r-settle 0.5s ease-out 1.1s both;
      }
      @keyframes r-draw { from { stroke-dashoffset: 130; } to { stroke-dashoffset: 0; } }
      @keyframes r-leg { from { stroke-dashoffset: 20; } to { stroke-dashoffset: 0; } }
      @keyframes r-dot { from { transform: scale(0); } to { transform: scale(1); } }
      @keyframes r-settle { 40% { transform: scale(1.08); } to { transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) {
        .r-draw, .r-draw * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg class="r-draw" viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 50V14h17.5a12.5 12.5 0 0 1 0 25H21" />
        <path d="M38 39l11 11" />
        <circle cx="37.5" cy="26.5" r="3.6" fill="#fff" stroke="none" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
